const slider = document.getElementById('slider'); slider.max = times.length-1; slider.value = times.length-1;
const types = ['person','organization','location','facility','event','other'];
document.getElementById('legend').innerHTML = types.map(t=>`<span><i style="background:var(--${t})"></i>${t}</span>`).join('')
  + '<span>◆ made claims · ┄ claims about</span>';
const ids = new Set(D.entities.map(e => e.id));
const degree = {}; D.facts.forEach(f => { degree[f.subject]=(degree[f.subject]||0)+1; degree[f.object]=(degree[f.object]||0)+1; });
const elements = [
  ...D.entities.map(e => ({data:{id:e.id, label:e.name, type:e.type, first:e.first, size: 18+8*Math.sqrt(degree[e.id]||1)},
                            classes: (e.claimant ? 'claimant' : '') + (e.outlet ? ' outlet' : '')})),
  ...D.facts.map(f => ({data:{id:'f'+f.id, source:f.subject, target:f.object, label:f.predicate, first:f.first, last:f.last,
                               width: 1+3*f.confidence}})),
  ...D.claims.flatMap((c, i) => (c.mentions || []).filter(m => ids.has(c.about) && ids.has(m)).map(m =>
      ({data:{id:`c${i}-${m}`, source:c.about, target:m, label:'claims', first:c.first, last:c.first, width:1}, classes:'claim'})))];
const cy = cytoscape({container: document.getElementById('graph'), elements, wheelSensitivity: 0.3,
  style: [
    {selector:'node', style:{'background-color': e => css('--'+e.data('type')), label:'data(label)', width:'data(size)', height:'data(size)',
      'font-size':11, 'font-family': css('--font-ui'), color: css('--ink'), 'text-valign':'bottom', 'text-margin-y':4, 'text-wrap':'wrap', 'text-max-width':120,
      'min-zoomed-font-size': 6,
      'border-width':2, 'border-color': css('--surface')}},
    {selector:'edge', style:{width:'data(width)', 'line-color': css('--line'), 'target-arrow-color': css('--line'),
      'target-arrow-shape':'triangle', 'curve-style':'bezier', label:'data(label)', 'font-size':9, color: css('--ink2'),
      'min-zoomed-font-size': 7,
      'text-rotation':'autorotate', 'text-background-color': css('--surface'), 'text-background-opacity':0.85, 'text-background-padding':2}},
    {selector:'.new', style:{'line-color': css('--new'), 'target-arrow-color': css('--new'), 'border-color': css('--new'), color: css('--ink')}},
    {selector:'edge.new', style:{'min-zoomed-font-size': 0, 'font-weight': 600}},
    {selector:'node.claimant', style:{shape:'diamond'}},
    {selector:'edge.claim', style:{'line-style':'dashed', 'target-arrow-shape':'none', 'line-color': css('--ink2'), opacity:0.6}},
    {selector:'.hidden', style:{display:'none'}},
    {selector:'.outlet-off', style:{display:'none'}},
    {selector:'.faded', style:{opacity:0.35}},
    {selector:':selected', style:{'border-color': css('--ink'), 'border-width':3}}],
  layout: {name: window.cytoscapeFcose ? 'fcose' : 'cose', animate:false, quality:'proof',
           nodeRepulsion: 12000, idealEdgeLength: 120, nodeSeparation: 90, packComponents: true, padding: 30}});
function show(i) {
  const t = times[i], prev = i ? times[i-1] : '';
  document.getElementById('when').textContent = `${i+1}/${times.length} · ${fmt(t)}`;
  document.getElementById('summary').textContent = D.snapshots[i].summary;
  const nFacts = D.facts.filter(f => f.first > prev && f.first <= t).length;
  const nClaims = D.claims.filter(c => c.first > prev && c.first <= t).length;
  const cap = document.getElementById('caption');
  cap.classList.add('fade');
  setTimeout(() => {
    document.getElementById('capStep').textContent = `Step ${i+1} of ${times.length} · ${fmt(t)}`;
    document.getElementById('capText').textContent = D.snapshots[i].delta || D.snapshots[i].summary;
    document.getElementById('capNew').textContent = i ? `+${nFacts} new facts · +${nClaims} new claims (red in the graph)`
                                                      : `${nFacts} facts · ${nClaims} claims to start with`;
    cap.classList.remove('fade');
  }, 150);
  cy.batch(() => {
    cy.elements().removeClass('new hidden faded');
    cy.edges().forEach(e => { if (e.data('first') > t) e.addClass('hidden');
      else { if (e.data('first') > prev) e.addClass('new'); if (e.data('last') < prev) e.addClass('faded'); } });
    cy.nodes().forEach(n => { const vis = n.connectedEdges().filter(e => !e.hasClass('hidden'));
      if (!vis.length) n.addClass('hidden'); else if (vis.filter(e => e.hasClass('new')).length && n.data('first') > prev) n.addClass('new'); });
  });
  const claims = D.claims.filter(c => c.first > prev && c.first <= t);
  const facts = D.facts.filter(f => f.first > prev && f.first <= t);
  document.getElementById('selTitle').textContent = `New at this checkpoint: ${facts.length} facts, ${claims.length} claims`;
  document.getElementById('side').innerHTML =
    (facts.length ? '<h2>New facts</h2>' + facts.map(f => `<div class="fact">${esc(nameOf(f.subject))} <b>${esc(f.predicate)}</b> ${esc(nameOf(f.object))}
      ${f.evidence.filter(e=>e.url).slice(0,1).map(e=>` <a href="${e.url}" target="_blank" rel="noopener">source</a>`).join('')}</div>`).join('') : '') +
    (claims.length ? '<h2>New claims</h2>' + claims.map(c => `<div class="claim"><b>${esc(c.claimant)}</b><span class="stance">${c.stance}</span><br>${esc(c.text)}
      ${c.evidence.filter(e=>e.url).map(e=>` <a href="${e.url}" target="_blank" rel="noopener">source</a>`).join('')}</div>`).join('') : '')
    || '<p class="muted">nothing new</p>';
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
cy.on('tap', 'node', ev => {
  const n = ev.target, t = times[+slider.value];
  const fs = D.facts.filter(f => (f.subject === n.id() || f.object === n.id()) && f.first <= t);
  const cs = D.claims.filter(c => c.about === n.id() && c.first <= t);
  document.getElementById('selTitle').textContent = `${n.data('label')} (${n.data('type')})`;
  document.getElementById('side').innerHTML =
    `<p class="muted">click empty space to go back to the checkpoint's claims</p>` +
    fs.map(f => `<div class="fact">${esc(nameOf(f.subject))} <b>${esc(f.predicate)}</b> ${esc(nameOf(f.object))}
      <span class="muted"> · from ${fmt(f.first)}</span>${f.evidence.filter(e=>e.url).map(e=>` <a href="${e.url}" target="_blank" rel="noopener">source</a>`).join('')}
      ${f.evidence.filter(e=>e.text).slice(0,2).map(e=>`<div class="muted">“${esc(e.text)}” (${esc(e.author)})</div>`).join('')}</div>`).join('') +
    (cs.length ? '<h2>Claims by ' + esc(n.data('label')) + '</h2>' + cs.map(c => `<div class="claim"><span class="stance">${c.stance}</span> ${esc(c.text)} <span class="muted">${fmt(c.first)}</span></div>`).join('') : '');
});
cy.on('tap', ev => { if (ev.target === cy) show(+slider.value); });
const names = Object.fromEntries(D.entities.map(e => [e.id, e.name])), nameOf = k => names[k] || k;
slider.addEventListener('input', () => show(+slider.value));
document.getElementById('caption').addEventListener('click', ev => ev.currentTarget.classList.toggle('small'));
document.getElementById('detailsBtn').addEventListener('click', () => document.body.classList.toggle('details'));
document.querySelector('aside').addEventListener('click', ev => { if (ev.target.tagName !== 'A') document.body.classList.remove('details'); });
const outletBox = document.getElementById('outlets');
function outlets() { const off = !outletBox.checked;
  cy.nodes('.outlet').forEach(n => { n.toggleClass('outlet-off', off); n.connectedEdges().toggleClass('outlet-off', off); }); }
outletBox.addEventListener('change', outlets); outlets();
let timer = null;
const speed = document.getElementById('speed'), playBtn = document.getElementById('play');
try { const saved = localStorage.getItem('tsk-step-ms'); if (saved && [...speed.options].some(o => o.value === saved)) speed.value = saved; } catch (e) {}
function stop() { clearInterval(timer); timer = null; playBtn.textContent = '▶ Play'; }
function tick() {
  if (+slider.value >= times.length - 1) { stop(); return; }
  slider.value = +slider.value + 1; show(+slider.value);
}
function start() { clearInterval(timer); timer = setInterval(tick, +speed.value); playBtn.textContent = '❚❚ Pause'; }
playBtn.onclick = () => {
  if (timer) { stop(); return; }
  if (+slider.value >= times.length - 1) { slider.value = 0; show(0); }  // from the start, unless paused midway
  start();
};
speed.addEventListener('change', () => {  // takes effect at once, also while playing
  try { localStorage.setItem('tsk-step-ms', speed.value); } catch (e) {}
  if (timer) start();
});
const storyEl = document.getElementById('capStory');
if (D.story) storyEl.textContent = D.story; else storyEl.hidden = true;
// #s5 opens the page at step 5 (for screenshots and links to a particular moment)
const stepFromHash = /^#s(\d+)$/.exec(location.hash);
const firstStep = stepFromHash ? Math.min(Math.max(+stepFromHash[1], 1), times.length) - 1 : times.length - 1;
slider.value = firstStep;
show(firstStep);
function clearCorner() {  // move the graph off the caption's corner
  const cap = document.getElementById('caption').getBoundingClientRect(), box = document.getElementById('graph').getBoundingClientRect();
  cy.fit(undefined, 20);
  if (box.width < 600) {  // portrait phone: there is room below the caption, so only move down
    cy.zoom({level: cy.zoom() * 0.95, renderedPosition: {x: box.width / 2, y: box.height}});
    cy.panBy({x: 0, y: Math.min(cap.height * 0.5, 80)});
  } else {
    cy.zoom({level: cy.zoom() * 0.9, renderedPosition: {x: box.width, y: box.height}});
    cy.panBy({x: Math.min(cap.width * 0.25, 60), y: Math.min(cap.height * 0.6, 90)});
  }
}
clearCorner();
window.addEventListener('resize', () => { cy.resize(); clearCorner(); });
</script></body></html>
